# HK 自托管部署线(2026-10-25,Vercel 分流方案):打 v* 标签 → 构建 standalone
# → 传 HK → 切软链 → 重启 ghb-web 容器 → 健康检查。
# 2026-10-27 改节奏:push main 只攒代码,不再自动部署 —— 发版=打标签(两线同步,详见 vercel-deploy 工作流)。
# 2026-10-31 收紧发布入口(指令03):移除 workflow_dispatch 手动触发 —— HK 生产部署
# 唯一入口=推送 v* tag(需单独审批);此前 10-27 假0事故曾用 dispatch 应急部署,
# 该应急通道与"部署必须单独审批"的治理纪律冲突,正式移除。应急回滚走服务器本地
# ln -sfn 切 releases(不经工作流,见 runbook)。
# 与 Vercel 双线并存:两边读同一个库;反代决定谁接客(nginx: 爬虫→HK,真人→Vercel)。
# 回滚 = 服务器上 ln -sfn 指回上一个 releases/<sha> 再 docker restart。
name: deploy-hk

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-hk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单测门禁(78 例,失败不部署)
        run: npm test

      - name: 构建(standalone)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKENS: ${{ secrets.GH_TOKENS }}
          NEXT_PUBLIC_SITE_URL: 'https://git.vaiox.xyz'
          # HK 自托管线关 @vercel/analytics(非 Vercel 运行时 beacon 全 404,见 layout 注释)
          NEXT_PUBLIC_ANALYTICS: 'off'
        run: npm run build

      - name: 打包
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          # 预建 use cache 的落盘目录:缺它时容器内每次写增量缓存 mkdir ENOENT
          #(2026-10-26 实测 24h 报错 1.4 万条、内存从基线 67MB 抬到 ~270MB)
          mkdir -p .next/standalone/.next/cache
          chmod -R 0777 .next/standalone/.next/cache
          tar -czf /tmp/release.tgz -C .next/standalone .

      - name: 上传 HK 并切换重启
        env:
          HK_DEPLOY_KEY: ${{ secrets.HK_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$HK_DEPLOY_KEY" > /tmp/dk
          chmod 600 /tmp/dk
          SHA=${GITHUB_SHA::12}
          scp -P 4492 -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i /tmp/dk /tmp/release.tgz root@45.197.146.227:/opt/ghb/app/incoming.tgz
          # 容器参数 2026-10-27 v8.3 对齐(服务器 /opt/ghb/app/run.sh 同款,事故复盘后定版):
          # slim+可写 cp -a/640m 帽/堆 360/grep 健检(slim 无 wget;健检 exec node 会加 40MB 尖峰)。
          # 384m/alpine/ro 挂载在爬虫高峰实测堆满自杀(30 分钟 5 轮),勿回退。
          # cachevol 独立卷挂 .next/cache(发布目录自清,卷保缓存);/app 可写(route-cache 落盘)。
          ssh -p 4492 -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i /tmp/dk root@45.197.146.227 "set -e; mkdir -p /opt/ghb/app/releases/$SHA; tar xzf /opt/ghb/app/incoming.tgz -C /opt/ghb/app/releases/$SHA; ln -sfn /opt/ghb/app/releases/$SHA /opt/ghb/app/current; rm -f /opt/ghb/app/incoming.tgz; mkdir -p /opt/ghb/app/cachevol; docker rm -f ghb-web >/dev/null 2>&1 || true; docker run -d --name ghb-web --network host --restart unless-stopped --memory 640m --memory-swap 640m --log-opt max-size=10m --log-opt max-file=3 --env-file /opt/ghb/app/.env -e HOSTNAME=127.0.0.1 -e PORT=3000 -e NODE_OPTIONS=--max-old-space-size=360 --health-cmd 'grep -qEis \":0BB8[[:space:]]+00000000:0000[[:space:]]+0A\" /proc/net/tcp' --health-interval 60s --health-timeout 15s --health-retries 3 --health-start-period 120s -v /opt/ghb/app/current:/app -v /opt/ghb/app/cachevol:/app/.next/cache -w /app node:20-slim sh -c 'cp -a /src/. /app/ 2>/dev/null || true; exec node server.js'; sleep 12; curl -sf -o /dev/null http://127.0.0.1:3000/api/boards/overall && echo DEPLOY_OK; ls -1dt /opt/ghb/app/releases/* | tail -n +4 | xargs -r rm -rf"

      - name: 部署后冒烟(公网全链,两次生产-only 断流都靠人肉 curl 才发现——固化为流水线步骤)
        run: |
          set -e
          sleep 30
          for path in "/zh" "/zh/boards/overall" "/zh/repo/vercel/next.js" "/zh/discover" "/api/boards/overall"; do
            for try in 1 2; do
              code=$(curl -sk --compressed -m 45 -o /tmp/smoke.html -w '%{http_code}' -A "Mozilla/5.0 (compatible; smoke/1.0)" "https://git.vaiox.xyz${path}")
              size=$(wc -c < /tmp/smoke.html | tr -d ' ')
              if [ "$code" = "200" ] && [ "$size" -gt 2000 ]; then
                echo "OK ${path} ${code} ${size}B"
                break
              fi
              if [ "$try" = "2" ]; then
                echo "SMOKE_FAIL ${path} http=${code} size=${size}B"
                exit 1
              fi
              sleep 20
            done
          done
          echo "SMOKE_ALL_OK"
