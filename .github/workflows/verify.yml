name: verify

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Beast SEO checks
        run: |
          set -euo pipefail
          B=https://github-hot-board.vercel.app
          echo "== key file:"; curl -s -m 30 $B/indexnow-key.txt | head -c 12; echo
          echo "== feed items:"; curl -s -m 30 $B/feed.xml | grep -c "<item>"
          A=$(curl -s -m 60 $B/zh/repo/microsoft/terminal)
          echo "== 档案页同榜块:"; echo "$A" | grep -c "同榜竞速" || true
          echo "== 档案页 title:"; echo "$A" | grep -o '<title>[^<]*</title>' | head -1
