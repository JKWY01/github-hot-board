name: verify

on:
  workflow_dispatch: {}

permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch prod pages
        run: |
          set -euo pipefail
          echo "== /zh title:"
          curl -s -m 60 https://github-hot-board.vercel.app/zh | grep -o '<title>[^<]*</title>' | head -1
          echo "== 价值块:" 
          curl -s -m 60 https://github-hot-board.vercel.app/zh | grep -oE "(信息差，就是明面上的机会|顺着趋势找赚钱抓手)" | sort -u
          echo "== /en title:"
          curl -s -m 60 https://github-hot-board.vercel.app/en | grep -o '<title>[^<]*</title>' | head -1
