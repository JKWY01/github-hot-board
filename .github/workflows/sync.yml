# 数据同步(唯一的进货通道):每 30 分钟一轮。
# 策略:逐榜单发(?only=<board>),每发都远小于函数 300s 上限——首建/冷库的全量
# 一发曾超时被平台 504 掐断(函数整发跑不完,workflow 红叉)。改成单榜接力后,
# 中断则下一个 30 分钟轮各自续跑,504 只会影响个别榜、不再判死整轮。
# 配置(仓库 Settings → Secrets and variables → Actions):
#   SYNC_URL    形如 https://你的域名/api/sync
#   CRON_SECRET 与 Vercel 环境变量 CRON_SECRET 相同
name: sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync
  cancel-in-progress: false

env:
  BOARD_SLUGS: >-
    overall weekly monthly annual rising dark overlooked controversial forks milestone

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping board by board
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          base="${SYNC_URL%/}"
          for b in ${BOARD_SLUGS}; do
            code=$(curl -s -m 330 -o /tmp/sync.json -w '%{http_code}' -X POST \
              -H "authorization: Bearer ${CRON_SECRET}" "${base}?only=${b}")
            echo "board ${b} -> http ${code}"
            head -c 240 /tmp/sync.json; echo
            case "${code}" in
              200) : ;;
              504) echo "(504:本榜本轮超时,数据已部分入库;下轮续跑)" ;;
              *) echo "unexpected ${code}; 继续其余榜,最后统一判失败"; FAILED=1 ;;
            esac
          done
          if [ "${FAILED:-0}" = "1" ]; then exit 1; fi

      - name: Checkout for README refresh
        uses: actions/checkout@v4

      - name: README 榜单快照刷新(搜索引擎载体)
        run: node scripts/readme-refresh.mjs

      - name: Commit README snapshot
        run: |
          if git diff --quiet README.md; then
            echo "内容无变化,跳过提交"
            exit 0
          fi
          git config user.name "ghb-bot"
          git config user.email "186710250+ghb-bot@users.noreply.github.com"
          git add README.md
          git commit -m "readme: 榜单快照自动刷新"
          git push
